{% extends "base.html" %}
{% block title %}客户审核 - EasyStock{% endblock %}

{% block extra_css %}
<style>
    .summary-card { border-left: 4px solid; }
    .summary-card.warning { border-left-color: #ffc107; }
    .customer-list { max-height: 500px; overflow-y: auto; }
    .table td { vertical-align: middle; }
    .area-select { width: 100%; min-width: 150px; }
    .no-data { text-align: center; color: #999; padding: 20px; }
</style>
{% endblock %}

{% block content %}
<h3 class="mb-4">
    <i class="bi bi-people"></i> 客户审核
    <small class="text-muted fs-6 ms-2">为未分配区域的客户指定所属区域</small>
</h3>

<div id="loadingArea" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2">正在扫描未分配区域的客户...</p>
</div>

<div id="mainContent" style="display:none;">
    <!-- 摘要卡片 -->
    <div class="row mb-4" id="summaryCards"></div>

    <div class="alert alert-info">以下客户尚未分配所属区域，请为每个客户选择区域，确认后批量更新。</div>
    <div class="d-flex justify-content-between mb-2">
        <button class="btn btn-sm btn-outline-primary" id="selectAll">全选</button>
        <button class="btn btn-sm btn-outline-secondary" id="deselectAll">取消全选</button>
    </div>
    <div class="customer-list">
        <table class="table table-hover table-bordered">
            <thead>
                <tr>
                    <th style="width:40px"><input type="checkbox" id="masterCheck"></th>
                    <th>ID</th>
                    <th>客户名称</th>
                    <th>联系电话</th>
                    <th>备注</th>
                    <th>推荐区域</th>   <!-- 新增 -->
                    <th>所属区域</th>
                </tr>
            </thead>
            <tbody id="customerTableBody"></tbody>
        </table>
    </div>
    <div class="mt-3">
        <button class="btn btn-success btn-lg" id="confirmAuditBtn">确认审核（更新区域）</button>
    </div>
    <div id="messageArea" class="mt-3"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let auditData = null;
let areaList = [];

$(document).ready(function() {
    loadAreas();
    loadAuditPreview();
});

function loadAreas() {
    $.ajax({
        url: '/customer-manage/area/list/',
        type: 'GET',
        success: function(res) {
            // 过滤出启用的区域（假设返回的数据包含 is_active 字段，若没有则假设全部启用）
            if (Array.isArray(res)) {
                areaList = res.filter(a => a.is_active !== false); // 若没有 is_active 字段，则全部保留
            } else {
                areaList = [];
            }
        },
        error: function() {
            console.warn('加载区域列表失败，请检查接口');
        }
    });
}

function loadAuditPreview() {
    $.ajax({
        url: '{% url "customer_manage:customer_audit_preview" %}',
        type: 'GET',
        beforeSend: function(xhr) {
            xhr.setRequestHeader('X-CSRFToken', getCsrfToken());
        },
        success: function(res) {
            if (res.code === 1) {
                auditData = res.data;
                renderPage(auditData);
            } else {
                $('#loadingArea').html(`<div class="alert alert-info">${res.msg}</div>`);
            }
        },
        error: function() {
            $('#loadingArea').html('<div class="alert alert-danger">加载失败，请刷新重试</div>');
        }
    });
}

function renderPage(data) {
    $('#loadingArea').hide();
    $('#mainContent').show();

    let cards = '';
    const count = data.customers ? data.customers.length : 0;
    cards += `<div class="col-md-3"><div class="card summary-card warning p-2"><strong>未分配区域客户</strong><br>${count} 个</div></div>`;
    $('#summaryCards').html(cards);

    let html = '';
    if (data.customers && data.customers.length > 0) {
        data.customers.forEach(function(c) {
            // 构建下拉选项，推荐区域自动选中
            let optionsHtml = '<option value="">-- 请选择区域 --</option>';
            areaList.forEach(function(a) {
                const selected = (a.id === c.recommended_area_id) ? ' selected' : '';
                optionsHtml += `<option value="${a.id}"${selected}>${a.name}</option>`;
            });
            html += `<tr>
                <td><input type="checkbox" class="customer-check" value="${c.id}"></td>
                <td>${c.id}</td>
                <td>${c.name}</td>
                <td>${c.phone || '无'}</td>
                <td>${c.remark || '无'}</td>
                <td>${c.recommended_area_name || '无'}</td>
                <td>
                    <select class="form-select form-select-sm area-select" data-id="${c.id}">
                        ${optionsHtml}
                    </select>
                </td>
            </tr>`;
        });
    } else {
        html = `<tr><td colspan="7" class="no-data">所有客户均已分配区域，无需审核</td></tr>`;
    }
    $('#customerTableBody').html(html);

    // 绑定全选事件（保持不变）
    $('#masterCheck').on('change', function() {
        $('.customer-check').prop('checked', this.checked);
    });
    $('#selectAll').click(function() {
        $('.customer-check').prop('checked', true);
    });
    $('#deselectAll').click(function() {
        $('.customer-check').prop('checked', false);
    });
}

// ===================== 确认审核 =====================
$('#confirmAuditBtn').click(function() {
    const $btn = $(this);
    $btn.prop('disabled', true).text('处理中...');
    $('#messageArea').html('');

    const items = [];
    $('.customer-check:checked').each(function() {
        const customerId = this.value;
        const $row = $(this).closest('tr');
        const areaId = $row.find('.area-select').val();
        if (areaId) {
            items.push({ customer_id: customerId, area_id: areaId });
        }
    });

    if (items.length === 0) {
        $('#messageArea').html('<div class="alert alert-warning">请至少勾选一个客户并为其选择区域</div>');
        $btn.prop('disabled', false).text('确认审核（更新区域）');
        return;
    }

    $.ajax({
        url: '{% url "customer_manage:customer_audit_confirm" %}',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ items: items }),
        beforeSend: function(xhr) {
            xhr.setRequestHeader('X-CSRFToken', getCsrfToken());
        },
        success: function(res) {
            if (res.code === 1) {
                $('#messageArea').html(`<div class="alert alert-success">${res.msg}</div>`);
                setTimeout(function() { location.reload(); }, 1500);
            } else {
                $('#messageArea').html(`<div class="alert alert-danger">${res.msg}</div>`);
                $btn.prop('disabled', false).text('确认审核（更新区域）');
            }
        },
        error: function() {
            $('#messageArea').html('<div class="alert alert-danger">请求失败，请稍后重试</div>');
            $btn.prop('disabled', false).text('确认审核（更新区域）');
        }
    });
});

function getCsrfToken() {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, 10) === 'csrftoken=') {
                cookieValue = decodeURIComponent(cookie.substring(10));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
