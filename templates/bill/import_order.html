{% extends "base.html" %}
{% block title %}导入订单 - EasyStock{% endblock %}

{% block extra_css %}
<style>
    .step { display: none; }
    .step.active { display: block; }
    .upload-area {
        border: 2px dashed #ccc;
        padding: 40px;
        text-align: center;
        cursor: pointer;
    }
    .upload-area:hover { border-color: #0d6efd; }
    .preview-table th, .preview-table td { vertical-align: middle; }
    .skip-row { background-color: #f8d7da !important; }
</style>
{% endblock %}

{% block content %}
<h3>订单导入 <small class="text-muted">—— 上传 Excel 并导入</small></h3>

<!-- 步骤条 -->
<div class="mb-4">
    <div class="d-flex">
        <div class="step-indicator active" id="step1Indicator">
            <span class="badge bg-primary">1</span> 上传文件
        </div>
        <div class="mx-3 align-self-center">→</div>
        <div class="step-indicator" id="step2Indicator">
            <span class="badge bg-secondary">2</span> 预览确认
        </div>
        <div class="mx-3 align-self-center">→</div>
        <div class="step-indicator" id="step3Indicator">
            <span class="badge bg-secondary">3</span> 导入完成
        </div>
    </div>
</div>

<!-- 步骤1：上传 -->
<div class="step active" id="step1">
    <div class="upload-area" id="uploadArea">
        <p class="mb-1"><i class="bi bi-cloud-upload fs-1"></i></p>
        <p>点击或拖拽上传 Excel 文件 (.xlsx)</p>
        <input type="file" id="excelFileInput" accept=".xlsx" style="display:none">
    </div>
    <div id="uploadMsg" class="mt-2"></div>
</div>

<!-- 步骤2：预览 -->
<div class="step" id="step2">
    <h5>订单预览</h5>
    <table class="table table-bordered preview-table">
        <thead>
            <tr>
                <th>订单编号</th>
                <th>客户</th>
                <th>区域</th>
                <th>商品明细</th>
                <th>状态</th>
                <th>警告</th>
            </tr>
        </thead>
        <tbody id="orderPreviewBody"></tbody>
    </table>
    <div class="mt-3">
        <button class="btn btn-secondary" onclick="goToStep(1)">返回</button>
        <button class="btn btn-success" id="confirmImportBtn">确认导入</button>
    </div>
</div>

<!-- 步骤3：结果 -->
<div class="step" id="step3">
    <div id="importResult"></div>
    <button class="btn btn-primary mt-3" onclick="window.location.href='{% url 'bill:order_list' %}'">返回订单列表</button>
</div>

{% endblock %}

{% block extra_js %}
<script>
let previewData = null;

function goToStep(num) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(`step${num}`).classList.add('active');
    document.querySelectorAll('.step-indicator').forEach(ind => ind.classList.remove('active'));
    document.getElementById(`step${num}Indicator`).classList.add('active');
}

function renderPreview() {
    if (!previewData) return;
    let html = '';
    previewData.orders.forEach(o => {
        const itemsStr = o.items.map(i => {
            const makeup = i.is_makeup ? ' <span class="badge bg-info">补货</span>' : '';
            return `${i.product_name}${makeup} (${i.unit}) x${i.qty}  ¥${i.price}`;
        }).join('<br>');
        const warnings = o.warnings.map(w => `<span class="badge bg-warning text-dark">${w}</span>`).join(' ');
        const rowClass = o.skip ? 'skip-row' : '';
        html += `<tr class="${rowClass}">
            <td>${o.order_no}</td>
            <td>${o.raw_customer_name}</td>
            <td>${o.area_name}</td>
            <td>${itemsStr}</td>
            <td>${o.status}</td>
            <td>${warnings}</td>
        </tr>`;
    });
    document.getElementById('orderPreviewBody').innerHTML = html;
}

function getCsrfToken() {
    const match = document.cookie.match(/csrftoken=([^;]+)/);
    return match ? match[1] : null;
}

document.addEventListener('DOMContentLoaded', function() {
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('excelFileInput');
    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);

        document.getElementById('uploadMsg').innerHTML = '<div class="alert alert-info">正在解析...</div>';
        fetch('{% url "bill:import_orders_preview" %}', {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': getCsrfToken() }
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 1) {
                previewData = data.data;
                renderPreview();
                goToStep(2);
            } else {
                document.getElementById('uploadMsg').innerHTML = `<div class="alert alert-danger">${data.msg}</div>`;
            }
        })
        .catch(err => {
            document.getElementById('uploadMsg').innerHTML = `<div class="alert alert-danger">请求失败：${err.message}</div>`;
        });
    });

    document.getElementById('confirmImportBtn').addEventListener('click', function() {
        if (!previewData) return;
        const btn = this;
        btn.disabled = true;
        btn.textContent = '导入中...';

        // 提交时只传 orders（不再包含新基础数据）
        fetch('{% url "bill:import_orders_confirm" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken(),
                'X-Requested-With': 'XMLHttpRequest',
            },
            body: JSON.stringify({ orders: previewData.orders })
        })
        .then(res => res.json())
        .then(data => {
            let html = '';
            if (data.code === 1) {
                html += `<div class="alert alert-success">${data.msg}</div>`;
                if (data.errors.length) {
                    html += '<div class="alert alert-warning"><ul>' + data.errors.map(e => `<li>${e}</li>`).join('') + '</ul></div>';
                }
            } else {
                html += `<div class="alert alert-danger">${data.msg}</div>`;
            }
            document.getElementById('importResult').innerHTML = html;
            goToStep(3);
        })
        .catch(err => {
            document.getElementById('importResult').innerHTML = `<div class="alert alert-danger">导入请求失败：${err.message}</div>`;
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = '确认导入';
        });
    });

    goToStep(1);
});
</script>
{% endblock %}
